<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="navyBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d2340"/>
      <stop offset="100%" stop-color="#071528"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Deep Navy Background -->
  <rect width="400" height="400" rx="48" fill="url(#navyBg)"/>

  <!-- V-Shield Geometric Network Crest -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Outer Crimson V Network -->
    <polyline points="96,105 200,262 304,105" stroke="#be123c" stroke-width="5"/>
    <polyline points="82,126 118,162 200,262 282,162 318,126" stroke="#e11d48" stroke-width="3.5"/>
    <!-- Inner White Network -->
    <polyline points="118,96 200,224 282,96" stroke="url(#silverGrad)" stroke-width="5"/>
    <line x1="88" y1="145" x2="152" y2="148" stroke="#e11d48" stroke-width="3"/>
    <line x1="312" y1="145" x2="248" y2="148" stroke="#e11d48" stroke-width="3"/>
    <line x1="102" y1="176" x2="168" y2="206" stroke="#f8fafc" stroke-width="2.5"/>
    <line x1="298" y1="176" x2="232" y2="206" stroke="#f8fafc" stroke-width="2.5"/>
    <line x1="138" y1="210" x2="200" y2="242" stroke="#e11d48" stroke-width="2.5"/>
    <line x1="262" y1="210" x2="200" y2="242" stroke="#e11d48" stroke-width="2.5"/>
  </g>

  <!-- Network Nodes -->
  <g>
    <circle cx="96" cy="105" r="5" fill="#e11d48"/>
    <circle cx="118" cy="96" r="5" fill="#ffffff"/>
    <circle cx="82" cy="126" r="4.5" fill="#ffffff"/>
    <circle cx="118" cy="162" r="5" fill="#ffffff"/>
    <circle cx="152" cy="148" r="4.5" fill="#e11d48"/>
    <circle cx="102" cy="176" r="4" fill="#e11d48"/>
    <circle cx="138" cy="210" r="4.5" fill="#ffffff"/>
    <circle cx="168" cy="206" r="4.5" fill="#e11d48"/>

    <circle cx="304" cy="105" r="5" fill="#e11d48"/>
    <circle cx="282" cy="96" r="5" fill="#ffffff"/>
    <circle cx="318" cy="126" r="4.5" fill="#ffffff"/>
    <circle cx="282" cy="162" r="5" fill="#ffffff"/>
    <circle cx="248" cy="148" r="4.5" fill="#e11d48"/>
    <circle cx="298" cy="176" r="4" fill="#e11d48"/>
    <circle cx="262" cy="210" r="4.5" fill="#ffffff"/>
    <circle cx="232" cy="206" r="4.5" fill="#e11d48"/>

    <circle cx="200" cy="262" r="5.5" fill="#ffffff"/>
    <circle cx="200" cy="224" r="4.5" fill="#e11d48"/>
  </g>

  <!-- Broadcast Sound Waves Left & Right -->
  <g fill="none" stroke="#e11d48" stroke-linecap="round">
    <path d="M162,74 A36,36 0 0,0 162,130" stroke-width="5"/>
    <path d="M145,62 A54,54 0 0,0 145,142" stroke-width="5"/>
    <path d="M238,74 A36,36 0 0,1 238,130" stroke-width="5"/>
    <path d="M255,62 A54,54 0 0,1 255,142" stroke-width="5"/>
  </g>

  <!-- Center Broadcast Microphone -->
  <g>
    <!-- Mic Cradle -->
    <path d="M167,108 v16 a33,33 0 0,0 66,0 v-16" fill="none" stroke="url(#silverGrad)" stroke-width="6" stroke-linecap="round"/>
    <line x1="200" y1="157" x2="200" y2="195" stroke="#dc2626" stroke-width="7" stroke-linecap="round"/>
    <!-- Mic Capsule -->
    <rect x="178" y="64" width="44" height="78" rx="22" fill="url(#redGrad)" stroke="#ffffff" stroke-width="3.5"/>
    <!-- Mic Grille Slats -->
    <line x1="184" y1="82" x2="194" y2="82" stroke="#7f1d1d" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="206" y1="82" x2="216" y2="82" stroke="#7f1d1d" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="183" y1="92" x2="194" y2="92" stroke="#7f1d1d" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="206" y1="92" x2="217" y2="92" stroke="#7f1d1d" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="184" y1="102" x2="194" y2="102" stroke="#7f1d1d" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="206" y1="102" x2="216" y2="102" stroke="#7f1d1d" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="180" y="109" width="40" height="4" fill="#e2e8f0"/>
  </g>

  <!-- Brand Typography -->
  <text x="200" y="316" text-anchor="middle" fill="#ffffff" font-family="Impact, 'Arial Narrow', 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="40" letter-spacing="1.5">
    VOICE OF VALOD
  </text>
  <text x="200" y="348" text-anchor="middle" fill="#e2e8f0" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="16" letter-spacing="5">
    ZENTRIX DIGITAL
  </text>
</svg>
